# Rebuilds the generated content indexes whenever content changes, so writing a
# Markdown file and pushing is enough to publish it:
#   blog/posts/**        → blog/posts.json
#   academy/courses/**   → academy/courses.json
name: Build content indexes

on:
  push:
    branches: [main]
    paths:
      - "blog/posts/**"
      - "academy/courses/**"
      - "tools/build_blog.py"
      - "tools/build_academy.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate blog/posts.json
        run: python tools/build_blog.py

      - name: Generate academy/courses.json
        run: python tools/build_academy.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- blog/posts.json academy/courses.json; then
            echo "indexes already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog/posts.json academy/courses.json
            git commit -m "content: rebuild indexes"
            git push
          fi
